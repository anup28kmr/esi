spring:
  application:
    name: user-service
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:user_service}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Postgres.2026}
  jpa:
    # Flyway owns the schema (V1__init.sql). validate makes Hibernate fail
    # fast if an entity drifts from the migration -- catches accidental
    # entity changes that weren't matched by a new migration.
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    jpa:
      repositories:
        bootstrap-mode: default
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 7000

# JWT signing config. The defaults match restaurant-service and menu-service so
# tokens issued here validate downstream. In any non-dev environment override
# JWT_SECRET (and JWT_ISSUER if you change it on the other services).
jwt:
  secret: ${JWT_SECRET:dGVzdC1zZWNyZXQtZm9yLWRldi1vbmx5LWRvLW5vdC11c2UtaW4tcHJvZC0xMjM0NTY=}
  issuer: ${JWT_ISSUER:quickbite-user-service}
  ttl: ${JWT_TTL:PT1H}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    ee.ut.quickbite.userservice: INFO
    org.springframework.web: INFO
