spring:
  application:
    name: order-service
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:order_service}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
  jpa:
    # Flyway owns the schema (V1__init.sql). validate makes Hibernate fail
    # fast if an entity drifts from the migration -- catches accidental
    # entity changes that weren't matched by a new migration.
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    jpa:
      repositories:
        bootstrap-mode: default
  flyway:
    enabled: true
    locations: classpath:db/migration
  # Consumer-only Kafka config. delivery-service publishes `delivery-events`
  # as raw JSON (StringSerializer), so we read it as String and parse with
  # a locally-constructed Jackson ObjectMapper inside the listener -- avoids
  # the Boot 4 / Jackson 3 namespace split that breaks DI of the legacy
  # com.fasterxml.jackson ObjectMapper in this service.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      missing-topics-fatal: false

# Feature flag for the Kafka listener. Disable in unit/integration tests
# that don't want a broker connection by setting app.kafka.enabled=false.
app:
  kafka:
    enabled: ${APP_KAFKA_ENABLED:true}

server:
  port: 7001

user-service:
  url: ${USER_SERVICE_URL:http://localhost:7000}

restaurant-service:
  url: ${RESTAURANT_SERVICE_URL:http://localhost:8081}

menu-service:
  url: ${MENU_SERVICE_URL:http://localhost:8082}

payment-service:
  url: ${PAYMENT_SERVICE_URL:http://localhost:8085}

delivery-service:
  url: ${DELIVERY_SERVICE_URL:http://localhost:8086}

# JWT validation -- shared across all services in the stack. Defaults match
# the dev secret/issuer used by user-service so a developer can run the
# service without setting env vars; docker-compose injects production values
# via the x-jwt-env anchor.
jwt:
  secret: ${JWT_SECRET:dGVzdC1zZWNyZXQtZm9yLWRldi1vbmx5LWRvLW5vdC11c2UtaW4tcHJvZC0xMjM0NTY=}
  issuer: ${JWT_ISSUER:quickbite-user-service}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html