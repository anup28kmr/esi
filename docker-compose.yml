name: quickbite

services:

  # ─── user-service stack ───────────────────────────────────────────────────

  postgres-user:
    image: postgres:15-alpine
    container_name: postgres-user
    environment:
      POSTGRES_DB: user_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5401:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [quickbite-net]

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "7000:7000"
    environment:
      DB_HOST: postgres-user
      DB_NAME: user_service
      DB_USERNAME: postgres
      DB_PASSWORD: password
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres-user:
        condition: service_healthy
    networks: [quickbite-net]

  # ─── order-service stack ──────────────────────────────────────────────────

  postgres-order:
    image: postgres:15-alpine
    container_name: postgres-order
    environment:
      POSTGRES_DB: order_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5402:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [quickbite-net]

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order-service
    ports:
      - "7001:7001"
    environment:
      DB_HOST: postgres-order
      DB_NAME: order_service
      DB_USERNAME: postgres
      DB_PASSWORD: password
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres-order:
        condition: service_healthy
    networks: [quickbite-net]

  # ─── api-gateway ──────────────────────────────────────────────────────────

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "9090:9090"
    environment:
      USER_SERVICE_HOST: user-service
      USER_SERVICE_PORT: 7000
      ORDER_SERVICE_HOST: order-service
      ORDER_SERVICE_PORT: 7001
      RESTAURANT_SERVICE_HOST: restaurant-service
      RESTAURANT_SERVICE_PORT: 8081
      MENU_SERVICE_HOST: menu-service
      MENU_SERVICE_PORT: 8082
    depends_on:
      - user-service
      - order-service
      - restaurant-service
      - menu-service
    networks: [quickbite-net]

  # ─── restaurant-service stack ─────────────────────────────────────────────

  restaurant-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: restaurant_db
      POSTGRES_USER: restaurant_user
      POSTGRES_PASSWORD: restaurant_pw
    ports:
      - "5403:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurant_user -d restaurant_db"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [quickbite-net]

  restaurant-service:
    build: ./restaurant-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8081:8081"
    depends_on:
      restaurant-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks: [quickbite-net]

  # ─── menu-service stack ───────────────────────────────────────────────────

  menu-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: menu_db
      POSTGRES_USER: menu_user
      POSTGRES_PASSWORD: menu_pw
    ports:
      - "5404:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U menu_user -d menu_db"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [quickbite-net]

  menu-service:
    build: ./menu-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8082:8082"
    depends_on:
      menu-db:
        condition: service_healthy
      restaurant-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks: [quickbite-net]

# ─── frontend ─────────────────────────────────────────────────────────────

  frontend:
    build:
      context: ./frontend
      args:
        VITE_APP_API_BASE_URL: ""
    ports:
      - "8090:80"
    environment:
      GATEWAY_UPSTREAM: http://api-gateway:9090
    depends_on:
      - api-gateway
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks: [quickbite-net]

networks:
  quickbite-net:
    driver: bridge
