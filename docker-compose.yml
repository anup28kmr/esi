name: quickbite

# Shared JWT signing config. Every service that issues or verifies tokens must
# use the same secret + issuer, or downstream services will reject the token
# and the SPA will log the user out. Set JWT_SECRET / JWT_ISSUER in the
# environment (or a .env file beside docker-compose.yml) to override.
x-jwt-env: &jwt-env
  JWT_SECRET: ${JWT_SECRET:-dGVzdC1zZWNyZXQtZm9yLWRldi1vbmx5LWRvLW5vdC11c2UtaW4tcHJvZC0xMjM0NTY=}
  JWT_ISSUER: ${JWT_ISSUER:-quickbite-user-service}

services:
  # ─── user-service stack ───────────────────────────────────────────────────
  postgres-user:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: user_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5401:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [quickbite-net]

  user-service:
    build: ./user-service
    environment:
      <<: *jwt-env
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres-user
      DB_PORT: 5432
      DB_NAME: user_service
      DB_USERNAME: postgres
      DB_PASSWORD: password
    ports:
      - "7000:7000"
    depends_on:
      postgres-user:
        condition: service_healthy
    networks: [quickbite-net]

  # ─── order-service stack ──────────────────────────────────────────────────
  postgres-order:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: order_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5402:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [quickbite-net]

  order-service:
    build: ./order-service
    environment:
      <<: *jwt-env
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres-order
      DB_PORT: 5432
      DB_NAME: order_service
      DB_USERNAME: postgres
      DB_PASSWORD: password
      # Compose-network hostname for user-service. Inside the container,
      # `localhost` would resolve to the order-service container itself,
      # so the UserClient default of http://localhost:7000 fails with an
      # I/O error. Use the service name on the quickbite-net bridge.
      USER_SERVICE_URL: http://user-service:7000
      RESTAURANT_SERVICE_URL: http://restaurant-service:8081
      MENU_SERVICE_URL: http://menu-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8085
      DELIVERY_SERVICE_URL: http://delivery-service:8086
      # DeliveryEventConsumer subscribes to `delivery-events` here to
      # mirror PICKED_UP / DELIVERED into the order row.
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "7001:7001"
    depends_on:
      postgres-order:
        condition: service_healthy
      user-service:
        condition: service_started
      restaurant-service:
        condition: service_started
      menu-service:
        condition: service_started
      payment-service:
        condition: service_started
      delivery-service:
        condition: service_started
      kafka:
        condition: service_healthy
    networks: [quickbite-net]

  # ─── api-gateway ──────────────────────────────────────────────────────────
  api-gateway:
    build: ./api-gateway
    environment:
      SPRING_PROFILES_ACTIVE: docker
      USER_SERVICE_URL: http://user-service:7000
      ORDER_SERVICE_URL: http://order-service:7001
      RESTAURANT_SERVICE_URL: http://restaurant-service:8081
      MENU_SERVICE_URL: http://menu-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8085
      DELIVERY_SERVICE_URL: http://delivery-service:8086
      NOTIFICATION_SERVICE_URL: http://notification-service:8087
    ports:
      - "9090:8080"
    depends_on:
      - user-service
      - order-service
      - restaurant-service
      - menu-service
      - payment-service
      - delivery-service
      - notification-service
    networks: [quickbite-net]

  # ─── restaurant-service stack ─────────────────────────────────────────────
  restaurant-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: restaurant_db
      POSTGRES_USER: restaurant_user
      POSTGRES_PASSWORD: restaurant_pw
    # Host port is overridable: a local Postgres on 5432 will collide
    # with the default. Set RESTAURANT_DB_HOST_PORT (e.g. 15432) to
    # remap. The container side stays 5432 so the service-side JDBC
    # URL never changes.
    ports:
      - "${RESTAURANT_DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurant_user -d restaurant_db"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [quickbite-net]

  menu-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: menu_db
      POSTGRES_USER: menu_user
      POSTGRES_PASSWORD: menu_pw
    # Host port is overridable. Set MENU_DB_HOST_PORT (e.g. 15433) if
    # 5433 is already taken on the host.
    ports:
      - "${MENU_DB_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U menu_user -d menu_db"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [quickbite-net]

  restaurant-service:
    build: ./restaurant-service
    environment:
      <<: *jwt-env
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8081:8081"
    depends_on:
      restaurant-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks: [quickbite-net]

  menu-service:
    build: ./menu-service
    environment:
      <<: *jwt-env
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8082:8082"
    depends_on:
      menu-db:
        condition: service_healthy
      restaurant-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks: [quickbite-net]

  # ─── frontend ─────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        VUE_APP_API_BASE_URL: http://localhost:9090
    ports:
      - "8090:80"
    depends_on:
      - api-gateway
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks: [quickbite-net]

  payment-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payment_db"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [quickbite-net]

  payment-service:
    build: ./payment-service
    environment:
      <<: *jwt-env
      SPRING_PROFILES_ACTIVE: docker
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8085:8085"
    depends_on:
      payment-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8085/api-docs"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks: [quickbite-net]

  delivery-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: delivery_db
      POSTGRES_USER: delivery_user
      POSTGRES_PASSWORD: delivery_pw
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delivery_user -d delivery_db"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [quickbite-net]

  delivery-service:
    build: ./delivery-service
    environment:
      <<: *jwt-env
      SPRING_PROFILES_ACTIVE: docker
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8086:8086"
    depends_on:
      delivery-db:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8086/api-docs"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks: [quickbite-net]

  # === Mike-Alfa (notification-service + Kafka event broker) ===
  # Kafka-compatible event broker. Redpanda speaks the same Kafka wire
  # protocol so Spring Kafka and rpk work unchanged; swap to apache/kafka
  # in any environment with native x86_64 if you prefer.
  kafka:
    image: redpandadata/redpanda:v24.2.4
    # No platform pinned: Docker pulls the manifest matching the host
    # arch (arm64 on Apple Silicon, amd64 on Intel/Win/Linux). Pinning
    # would force emulation on the wrong arch.
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://kafka:9092
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info --brokers kafka:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [quickbite-net]

  notification-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: notification
      POSTGRES_PASSWORD: notification
    ports:
      - "${NOTIFICATION_DB_HOST_PORT:-5436}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification -d notification_db"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [quickbite-net]

  notification-service:
    build: ./notification-service
    environment:
      <<: *jwt-env
      SPRING_PROFILES_ACTIVE: docker
      ORDER_SERVICE_URL: http://order-service:7001
    ports:
      - "8087:8087"
    depends_on:
      notification-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8087/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks: [quickbite-net]

networks:
  quickbite-net:
    driver: bridge
