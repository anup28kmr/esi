# Brings menu-service + restaurant-service up with their PostgreSQL DBs
# for the Checkpoint 2 demo (Items A and B). Run from repo root:
#
#   docker compose up --build
#
# Then:
#   - http://localhost:8081/swagger-ui.html  (restaurant-service)
#   - http://localhost:8082/swagger-ui.html  (menu-service)
#
# Item B is demonstrated by hitting a write endpoint on menu-service
# (POST/PUT/DELETE under /restaurants/{rid}/menu-items or /menu-items/*),
# which triggers RestaurantOwnershipClient to call restaurant-service
# at http://restaurant-service:8081/restaurants/{rid} -- a real HTTP
# hop on the quickbite-net bridge, not a mock.

name: quickbite

services:
  restaurant-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: restaurant_db
      POSTGRES_USER: restaurant_user
      POSTGRES_PASSWORD: restaurant_pw
    # Host port is overridable: a local Postgres on 5432 will collide
    # with the default. Set RESTAURANT_DB_HOST_PORT (e.g. 15432) to
    # remap. The container side stays 5432 so the service-side JDBC
    # URL never changes.
    ports:
      - "${RESTAURANT_DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurant_user -d restaurant_db"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [quickbite-net]

  menu-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: menu_db
      POSTGRES_USER: menu_user
      POSTGRES_PASSWORD: menu_pw
    # Host port is overridable. Set MENU_DB_HOST_PORT (e.g. 15433) if
    # 5433 is already taken on the host.
    ports:
      - "${MENU_DB_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U menu_user -d menu_db"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [quickbite-net]

  restaurant-service:
    build: ./restaurant-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8081:8081"
    depends_on:
      restaurant-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks: [quickbite-net]

  menu-service:
    build: ./menu-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8082:8082"
    depends_on:
      menu-db:
        condition: service_healthy
      restaurant-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks: [quickbite-net]

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      restaurant-service:
        condition: service_healthy
      menu-service:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 not localhost: busybox wget resolves localhost to
      # ::1, but the nginx config above listens IPv4 only.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks: [quickbite-net]

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the Vue bundle by client.js. Browser-reachable
        # URL of the gateway (host-mapped 8080). Cross-origin to the
        # gateway, which has CORS configured -- avoids the /api/
        # prefix complications that the original same-origin design
        # would have required in client.js.
        VUE_APP_API_BASE_URL: http://localhost:8080
    ports:
      - "8090:80"
    environment:
      # Used by the frontend's own nginx /api/** fallback proxy.
      # Not exercised by the Option-X cross-origin flow above, but
      # set correctly so a future same-origin switch works without
      # changing this compose entry.
      GATEWAY_UPSTREAM: http://gateway
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks: [quickbite-net]

  payment-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payment_db"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [quickbite-net]

  payment-service:
    build: ./payment-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8085:8085"
    depends_on:
      payment-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8085/api-docs"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks: [quickbite-net]

  delivery-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: delivery_db
      POSTGRES_USER: delivery_user
      POSTGRES_PASSWORD: delivery_pw
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delivery_user -d delivery_db"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [quickbite-net]

  delivery-service:
    build: ./delivery-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8086:8086"
    depends_on:
      delivery-db:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8086/api-docs"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks: [quickbite-net]

  # === Mike-Alfa (notification-service + Kafka event broker) ===

  # Kafka-compatible event broker. We use Redpanda (Go binary, Kafka
  # protocol over the wire) instead of Apache Kafka because the JVM
  # JIT compiler crashes under qemu user-mode emulation on Apple
  # Silicon Colima. Spring Kafka, kafka-topics.sh, etc. all talk to
  # this broker transparently. Replace with apache/kafka in any
  # environment that has native x86_64 hardware available.
  kafka:
    image: redpandadata/redpanda:v24.2.4
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://kafka:9092
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info --brokers kafka:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    networks: [quickbite-net]

  notification-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: notification
      POSTGRES_PASSWORD: notification
    ports:
      - "${NOTIFICATION_DB_HOST_PORT:-5436}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification -d notification_db"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [quickbite-net]

  notification-service:
    build: ./notification-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8087:8087"
    depends_on:
      notification-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8087/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks: [quickbite-net]

networks:
  quickbite-net:
    driver: bridge
