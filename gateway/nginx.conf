# QuickBite API gateway -- thin nginx reverse proxy on the
# quickbite-net bridge. Each service owner adds one location block
# per service prefix below; restaurant-service and menu-service are
# already wired (Sierra-Lima). Cross-service path conflicts are
# resolved by location precedence: regex locations win over plain
# prefix locations, so /restaurants/{id}/menu-items routes to
# menu-service even though /restaurants/ prefix-matches first.

events { worker_connections 1024; }

http {
    # Docker's embedded resolver. With a 30-second TTL, nginx will
    # re-resolve upstream container hostnames whenever a service is
    # recreated (and gets a new bridge-network IP). This ONLY works
    # when the hostname appears in a variable inside proxy_pass --
    # nginx caches literal hostnames at startup and never refreshes
    # them. Each location below uses `set $upstream <hostname>` plus
    # `proxy_pass http://$upstream:PORT$uri$is_args$args` so the
    # resolver actually kicks in. The $uri$is_args$args suffix is
    # required because nginx skips its auto-URI behaviour when the
    # proxy_pass URL contains variables.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Common proxy options applied to every location.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    client_max_body_size 2m;

    # Strip any CORS headers an upstream service might add. The gateway
    # is the single source of CORS truth. Without this, a service that
    # auto-responds to preflight (Spring's default behaviour) plus the
    # gateway's `add_header always` produces duplicate headers, which
    # browsers treat as a network error per the CORS spec.
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Max-Age;

    server {
        listen 80;
        server_name _;

        # CORS: echo back the caller's Origin so credentialed
        # requests work. `always` attaches headers on 4xx/5xx too
        # and -- crucially -- they propagate to every location below
        # because none of those locations set their own add_header.
        # Preflight (OPTIONS) requests are not short-circuited here:
        # nginx forbids `add_header` inside a server-level `if`, so
        # OPTIONS passes through to upstream where Spring auto-
        # handles it with a 2xx + Allow header. The CORS response
        # headers attach via `always` on the way back.
        add_header Access-Control-Allow-Origin      $http_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers     "Authorization, Content-Type, Accept, Origin" always;
        add_header Access-Control-Max-Age           "86400" always;

        # === Sierra-Lima (Sten-Qy-Li) ===
        # All locations use regex form so `/restaurants` (no slash)
        # and `/restaurants/...` are both routed without nginx's
        # auto-301-add-trailing-slash kicking in. Regex locations
        # are evaluated top-down, first match wins, so the more
        # specific menu-items-under-restaurant pattern must come
        # first.
        #
        # Each path is exposed twice. The bare form (e.g. /restaurants)
        # is for curl and server-to-server callers. The /api-prefixed
        # form (e.g. /api/restaurants) is for the browser SPA, whose
        # client.js targets /api/** so the frontend's own nginx /api
        # passthrough is a no-op and the gateway is the single place
        # that strips the prefix (decision 0020 §10). The `rewrite ...
        # break` keeps the query string intact and stops further
        # location reprocessing.
        location ~ ^/api/restaurants/[^/]+/menu-items {
            set $upstream menu-service;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$upstream:8082$uri$is_args$args;
        }
        location ~ ^/api/restaurants(?:/|$) {
            set $upstream restaurant-service;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$upstream:8081$uri$is_args$args;
        }
        location ~ ^/api/menu-items(?:/|$) {
            set $upstream menu-service;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$upstream:8082$uri$is_args$args;
        }
        location ~ ^/restaurants/[^/]+/menu-items {
            set $upstream menu-service;
            proxy_pass http://$upstream:8082$uri$is_args$args;
        }
        location ~ ^/restaurants(?:/|$) {
            set $upstream restaurant-service;
            proxy_pass http://$upstream:8081$uri$is_args$args;
        }
        location ~ ^/menu-items(?:/|$) {
            set $upstream menu-service;
            proxy_pass http://$upstream:8082$uri$is_args$args;
        }

        # === Ege (delivery-service + payment-service) ===
        location ~ ^/deliveries(?:/|$) {
            set $upstream delivery-service;
            proxy_pass http://$upstream:8086$uri$is_args$args;
        }
        location ~ ^/payments(?:/|$) {
            set $upstream payment-service;
            proxy_pass http://$upstream:8085$uri$is_args$args;
        }

        # === Other owners: add your service location block(s) below ===
        # Use the same pattern: `set $upstream <hostname>` then
        # `proxy_pass http://$upstream:PORT$uri$is_args$args`. The
        # variable form is required for the resolver to refresh the
        # upstream IP after a `docker compose restart` of that
        # service. Example for an order-service on :8083 (owner:
        # Charlie-Lima-Alfa):
        #
        # location ~ ^/orders(?:/|$) {
        #     set $upstream order-service;
        #     proxy_pass http://$upstream:8083$uri$is_args$args;
        # }
        # ===============================================================

        # Gateway own-health (independent of upstreams).
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
    }
}
