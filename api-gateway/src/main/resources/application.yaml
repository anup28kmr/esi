spring:
  application:
    name: api-gateway

# Routes are defined in GatewayRoutesConfig (Java DSL). The DSL is used
# instead of YAML here because it gives us deterministic ordering between
# more-specific and catch-all routes (e.g. /api/restaurants/{id}/menu-items
# must hit menu-service before /api/restaurants/** sends it to restaurant-
# service) and lets us inject service host/port via @Value.
#
# CORS is handled by CorsConfig (WebMvcConfigurer); leaving the gateway-
# globalcors block in here would double-set headers on responses.

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.web: INFO
    org.springframework.web.servlet.mvc: INFO
    reactor.netty.http.client: INFO
    ee.ut.quickbite.apigateway: DEBUG
    ee.ut.quickbite.apigateway.config: DEBUG
