$kind: http-request
name: GET /restaurants?size=2  (paged list, seeded)
url: "{{gatewayUrl}}/restaurants?size=2"
method: GET
queryParams:
  size: "2"
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      const j = pm.response.json();
      pm.test('paged envelope', () => pm.expect(j).to.have.property('content').that.is.an('array'));
      pm.test('seed data present', () => pm.expect(j.totalElements).to.be.greaterThan(0));
    language: text/javascript
order: 1000
