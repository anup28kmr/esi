$kind: http-request
name: GET /menu-items/{{menuItemId}}  (Margherita)
url: "{{gatewayUrl}}/menu-items/{{menuItemId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('Margherita', () => pm.expect(pm.response.json().name).to.eql('Margherita'));
    language: text/javascript
order: 4000
